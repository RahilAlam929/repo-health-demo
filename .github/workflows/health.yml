name: Repo Health

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Repo Health Check
        id: health
        uses: RahilAlam929/repo-health-action@v1.2
        with:
          min-score: "80"

      - name: Show Health Result
        run: |
          echo "🏥 Health Score: ${{ steps.health.outputs.health-score }}/100"
          echo "🎓 Grade: ${{ steps.health.outputs.grade }}"

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HEALTH_SCORE: ${{ steps.health.outputs.health-score }}
          HEALTH_GRADE: ${{ steps.health.outputs.grade }}
        with:
          script: |
            const score = process.env.HEALTH_SCORE;
            const grade = process.env.HEALTH_GRADE;

            const body = [
              "## 🏥 Repo Health Report",
              "",
              `**Score:** ${score}/100`,
              "",
              `**Grade:** ${grade}`,
              "",
              "| Check | Status |",
              "|---|---|",
              "| 📄 README | Checked |",
              "| ⚖️ LICENSE | Checked |",
              "| ⚙️ CI/CD | Checked |",
              "| 📁 Files | Checked |",
              "",
              "🤖 Generated automatically by Repo Health Action."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
